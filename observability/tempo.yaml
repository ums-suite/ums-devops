# Minimal single-binary Tempo config for local development (ums-conventions.md Observability).
# Not tuned for production - ums-infra owns the real Helm-deployed Tempo config for the kind
# cluster (helm/platform-observability).

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        # Explicit endpoints are required - an empty `grpc:`/`http:` block does not fall back to a
        # default bind address in this Tempo version, so the OTLP receiver silently never starts
        # and the Collector's otlp/tempo exporter spins forever on "connection refused" instead.
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
