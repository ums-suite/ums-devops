# Local dev infra stack: PostgreSQL, Redis, MinIO (S3-compatible object storage, ADR-0010), plus
# ums-core (UMS.Host), UMS.Workers, and all six ums-*-web frontends now that every backend flow
# and every frontend app is fully built - the container-diagram.md containers, on one Docker
# network, one command.
#
# Still excluded: ums-core's own EF Core migration step is applied by ums-core itself on startup
# (see its own Program.cs), not as a separate compose service/init container.
#
# One Postgres instance, one database, no per-schema bootstrap SQL here - ADR-0004 puts the
# schema-per-module layout entirely in ums-core's own EF Core migrations, not in infra tooling.
# This mirrors kart-devops's shared-Postgres-instance approach, simplified further since UMS has
# no per-service database split to begin with (ADR-0001: one deployable, one database).
#
# Usage: scripts/dev-up.sh (auto-copies .env.example -> .env on first run, then
# `docker compose up -d`). Host ports come from ports.env (committed, not a secret) -
# credentials come from .env (gitignored - see .env.example).
#
# --- Frontend API base URL (all six ums-*-web services below) ---
# Every app's production `environment.ts` bakes `apiBaseUrl` in at Angular *build* time (Angular
# inlines it into the compiled bundle - it is not a runtime-configurable value), and every app's
# own HTTP layer (`core/http/provide-core-http.ts`) is written so ALL API calls originate
# client-side, in the browser (`provideApi`/`UMS_AUTH_CONFIG` are both bootstrapped from that same
# baked value). That means the correct base URL for local-dev-container purposes is the URL the
# HOST machine's browser can reach ums-core at - i.e. `http://localhost:${UMS_CORE_PORT}` - NOT
# the in-network `http://ums-core:8080` address (the browser is never inside the Compose network).
# Each frontend's Dockerfile takes this as an `API_BASE_URL` build arg and `sed`s it into
# `src/environments/environment.ts` before `ng build` - see each Dockerfile's own header comment.
#
# Known limitation: `ums-public-web` and `ums-alumni-web` render almost every route with
# `RenderMode.Server` (see each app's own `app.routes.server.ts`), meaning their Express/Node
# process ALSO issues its own server-side data-fetch calls using this same baked URL - and
# `http://localhost:${UMS_CORE_PORT}` is not reachable as "localhost" from inside those
# containers' own network namespace (only from the host). Those specific server-rendered,
# data-backed routes will render a degraded/empty-state shell rather than fully hydrated content
# when curled directly; all client-side/hydrated and CSR-only routes (e.g. `/app/**`, `/login`)
# are unaffected since they run entirely in-browser against the host-published port. Fixing this
# properly needs a per-platform (browser vs. server) base-URL split inside each app - out of scope
# for this devops-only change; tracked here rather than silently glossed over.
#
# `ums-admission-web`'s `angular.json` also ships `security.allowedHosts: []` (a deny-ALL for
# `@angular/ssr`'s SSRF-prevention host-header check - every request 500s otherwise, per that
# app's own `src/server.ts` doc comment). `NG_ALLOWED_HOSTS=*` below is what that same comment
# says `@angular/ssr` reads ahead of the baked-in list, so this is set for all three SSR services.

name: ums-devops

services:
  postgres:
    image: postgres:17-alpine
    container_name: ums-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432" # 5432 is commonly already taken by a local Postgres install
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # No volume: Redis is cache/session/rate-limit/coordination only, never a source of truth
  # (ADR-0007) - losing it on a container recreate is an accepted, correct trade-off for local dev.
  redis:
    image: redis:7-alpine
    container_name: ums-redis
    ports:
      - "${REDIS_PORT}:6379" # 6379 is commonly already taken by a local Redis install
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: ums-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"     # S3 API
      - "${MINIO_CONSOLE_PORT}:9001" # Web console - http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bucket bootstrap (ADR-0010: documents/media blobs live in object storage, only
  # metadata in Postgres). Runs `mc` (MinIO's own client, not installed in the server image
  # above) once against the healthy minio service, creates the dev bucket idempotently, then
  # exits - `restart: "no"` keeps it from looping. This is the "bucket-bootstrap init container"
  # every S3-compatible local-dev stack needs since a fresh MinIO instance starts with zero
  # buckets and ums-core has no bootstrap-on-startup code of its own yet.
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: ums-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set localminio http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing localminio/\"$$MINIO_BUCKET\" &&
      echo 'Bucket ready: '\"$$MINIO_BUCKET\"
      "
    restart: "no"

  # UMS.Host - the single ums-core deployable (ADR-0001), all 18 modules behind one ASP.NET Core
  # pipeline. No module exists yet (Identity is release/DEVELOPMENT_PLAN.md Flow #4), so this
  # currently serves only /health/live and /health/ready plus the empty OpenAPI document.
  ums-core:
    build:
      context: ../ums-core
      dockerfile: Dockerfile
    container_name: ums-core
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      # appsettings.Development.json hardcodes both of these to http://localhost:9000 (only
      # right when ums-core runs on the host, not in a container) - env vars win over
      # appsettings.json in ASP.NET Core's config precedence, so this is what actually points the
      # Audit/Documents modules' S3ObjectStorage at the in-network minio service instead.
      Audit__Storage__Endpoint: "http://minio:9000"
      Audit__Storage__AccessKey: "${MINIO_ROOT_USER}"
      Audit__Storage__SecretKey: "${MINIO_ROOT_PASSWORD}"
      Documents__Storage__Endpoint: "http://minio:9000"
      Documents__Storage__AccessKey: "${MINIO_ROOT_USER}"
      Documents__Storage__SecretKey: "${MINIO_ROOT_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${UMS_CORE_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # UMS.Workers - background job runner (ADR-0014), a separate deployable from ums-core even
  # though both build from this same repo. No async job exists yet, so this only proves the
  # health-endpoint host runs; the first real worker (a module's outbox relay) lands with that
  # module.
  ums-workers:
    build:
      context: ../ums-core
      dockerfile: Dockerfile.workers
    container_name: ums-workers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      # Same S3ObjectStorage hardcoded-localhost fix as ums-core above - UMS.Workers loads the
      # same appsettings.Development.json shape from its own project.
      Audit__Storage__Endpoint: "http://minio:9000"
      Audit__Storage__AccessKey: "${MINIO_ROOT_USER}"
      Audit__Storage__SecretKey: "${MINIO_ROOT_PASSWORD}"
      Documents__Storage__Endpoint: "http://minio:9000"
      Documents__Storage__AccessKey: "${MINIO_ROOT_USER}"
      Documents__Storage__SecretKey: "${MINIO_ROOT_PASSWORD}"
    ports:
      - "${UMS_WORKERS_PORT}:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ums-public-web - anonymous/public-facing app (near-fully SSR, RenderMode.Server for almost
  # every route - see its own app.routes.server.ts). See the "Frontend API base URL" comment near
  # the top of this file for how API_BASE_URL/NG_ALLOWED_HOSTS are chosen.
  ums-public-web:
    build:
      context: ../ums-public-web
      dockerfile: Dockerfile
      args:
        API_BASE_URL: "http://localhost:${UMS_CORE_PORT}"
    container_name: ums-public-web
    depends_on:
      ums-core:
        condition: service_healthy
    environment:
      PORT: "4000"
      NG_ALLOWED_HOSTS: "*"
    ports:
      - "${PUBLIC_WEB_PORT}:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ums-admission-web - applicant-facing admission funnel. Prerendered marketing pages +
  # CSR-only authenticated funnel under /app (see its own app.routes.server.ts). Its own
  # angular.json ships security.allowedHosts: [] (a documented deny-ALL bug in that app's own
  # src/server.ts comment) - NG_ALLOWED_HOSTS below is required here, not just a nicety.
  ums-admission-web:
    build:
      context: ../ums-admission-web
      dockerfile: Dockerfile
      args:
        API_BASE_URL: "http://localhost:${UMS_CORE_PORT}"
    container_name: ums-admission-web
    depends_on:
      ums-core:
        condition: service_healthy
    environment:
      PORT: "4000"
      NG_ALLOWED_HOSTS: "*"
    ports:
      - "${ADMISSION_WEB_PORT}:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ums-student-web - CSR-only Angular SPA, static files served by nginx (no Node runtime needed).
  ums-student-web:
    build:
      context: ../ums-student-web
      dockerfile: Dockerfile
      args:
        API_BASE_URL: "http://localhost:${UMS_CORE_PORT}"
    container_name: ums-student-web
    depends_on:
      ums-core:
        condition: service_healthy
    ports:
      - "${STUDENT_WEB_PORT}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ums-faculty-web - CSR-only Angular SPA, static files served by nginx.
  ums-faculty-web:
    build:
      context: ../ums-faculty-web
      dockerfile: Dockerfile
      args:
        API_BASE_URL: "http://localhost:${UMS_CORE_PORT}"
    container_name: ums-faculty-web
    depends_on:
      ums-core:
        condition: service_healthy
    ports:
      - "${FACULTY_WEB_PORT}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ums-admin-web - CSR-only Angular SPA, static files served by nginx.
  ums-admin-web:
    build:
      context: ../ums-admin-web
      dockerfile: Dockerfile
      args:
        API_BASE_URL: "http://localhost:${UMS_CORE_PORT}"
    container_name: ums-admin-web
    depends_on:
      ums-core:
        condition: service_healthy
    ports:
      - "${ADMIN_WEB_PORT}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ums-alumni-web - hybrid SSR/CSR (SSR for anonymous campaign/donation/story pages, CSR for the
  # authenticated /app shell + /login/register - see its own app.routes.server.ts).
  ums-alumni-web:
    build:
      context: ../ums-alumni-web
      dockerfile: Dockerfile
      args:
        API_BASE_URL: "http://localhost:${UMS_CORE_PORT}"
    container_name: ums-alumni-web
    depends_on:
      ums-core:
        condition: service_healthy
    environment:
      PORT: "4000"
      NG_ALLOWED_HOSTS: "*"
    ports:
      - "${ALUMNI_WEB_PORT}:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
