# Local dev infra stack: PostgreSQL, Redis, MinIO (S3-compatible object storage, ADR-0010), plus
# ums-core (UMS.Host) and UMS.Workers now that release/DEVELOPMENT_PLAN.md Flow #2 has scaffolded
# a buildable solution - the container-diagram.md containers, on one Docker network, one command.
#
# Still excluded: all six ums-*-web frontend containers and ums-core's own EF Core migration step
# (no module has a DbContext yet - Identity, Flow #4, is the first). Add a migration step here once
# that exists, and one service block per frontend once each reaches a buildable state.
#
# One Postgres instance, one database, no per-schema bootstrap SQL here - ADR-0004 puts the
# schema-per-module layout entirely in ums-core's own EF Core migrations, not in infra tooling.
# This mirrors kart-devops's shared-Postgres-instance approach, simplified further since UMS has
# no per-service database split to begin with (ADR-0001: one deployable, one database).
#
# Usage: scripts/dev-up.sh (auto-copies .env.example -> .env on first run, then
# `docker compose up -d`). Host ports come from ports.env (committed, not a secret) -
# credentials come from .env (gitignored - see .env.example).

name: ums-devops

services:
  postgres:
    image: postgres:17-alpine
    container_name: ums-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432" # 5432 is commonly already taken by a local Postgres install
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # No volume: Redis is cache/session/rate-limit/coordination only, never a source of truth
  # (ADR-0007) - losing it on a container recreate is an accepted, correct trade-off for local dev.
  redis:
    image: redis:7-alpine
    container_name: ums-redis
    ports:
      - "${REDIS_PORT}:6379" # 6379 is commonly already taken by a local Redis install
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: ums-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"     # S3 API
      - "${MINIO_CONSOLE_PORT}:9001" # Web console - http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bucket bootstrap (ADR-0010: documents/media blobs live in object storage, only
  # metadata in Postgres). Runs `mc` (MinIO's own client, not installed in the server image
  # above) once against the healthy minio service, creates the dev bucket idempotently, then
  # exits - `restart: "no"` keeps it from looping. This is the "bucket-bootstrap init container"
  # every S3-compatible local-dev stack needs since a fresh MinIO instance starts with zero
  # buckets and ums-core has no bootstrap-on-startup code of its own yet.
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: ums-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set localminio http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing localminio/\"$$MINIO_BUCKET\" &&
      echo 'Bucket ready: '\"$$MINIO_BUCKET\"
      "
    restart: "no"

  # UMS.Host - the single ums-core deployable (ADR-0001), all 18 modules behind one ASP.NET Core
  # pipeline. No module exists yet (Identity is release/DEVELOPMENT_PLAN.md Flow #4), so this
  # currently serves only /health/live and /health/ready plus the empty OpenAPI document.
  ums-core:
    build:
      context: ../ums-core
      dockerfile: Dockerfile
    container_name: ums-core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
    ports:
      - "${UMS_CORE_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # UMS.Workers - background job runner (ADR-0014), a separate deployable from ums-core even
  # though both build from this same repo. No async job exists yet, so this only proves the
  # health-endpoint host runs; the first real worker (a module's outbox relay) lands with that
  # module.
  ums-workers:
    build:
      context: ../ums-core
      dockerfile: Dockerfile.workers
    container_name: ums-workers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
    ports:
      - "${UMS_WORKERS_PORT}:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
